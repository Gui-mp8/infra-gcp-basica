#prd-deploy.yaml
name: Terraform Deploy Prod

on:
  pull_request:
    # só dispara para PRs cujo destino é infra-prd
    branches:
      - infra-prd
    # você pode filtrar tipos de evento, opcional:
    # types:
    #   - opened
    #   - reopened
    #   - synchronize

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: prd
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github"
          service_account: "terraform-prod@your-project-id.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init \
               -backend-config="bucket=infra-terraform" \
               -backend-config="prefix=infra-simples/prd"

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
