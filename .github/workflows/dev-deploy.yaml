#dev-deploy.yaml
name: Terraform Deploy Dev

on:
  push:
    # dispara em qualquer branch exceto infra-prd
    branches-ignore:
      - infra-prd



permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github"
          service_account: "terraform-dev@your-project-id.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init \
               -backend-config="bucket=infra-simples-terraform" \
               -backend-config="prefix=infra-simples/dev"

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
